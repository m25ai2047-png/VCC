<div style="margin: 20px;">
  <h1>Employee Viewer</h1>
  
  <div style="margin: 20px 0;">
    <label>Employee ID: </label>
    <input type="number" [(ngModel)]="employeeId" min="1" style="margin: 0 10px; padding: 5px;">
    <button (click)="getEmployee()" style="padding: 5px 15px;">Get Employee</button>
  </div>

  <div *ngIf="loading" style="margin: 20px 0;">Loading...</div>

  <div *ngIf="error" style="margin: 20px 0; color: red;">{{ error }}</div>

  <div *ngIf="employee" style="margin: 20px 0;">
    <h2>Employee Details</h2>
    <p><strong>ID:</strong> {{ employee.id }}</p>
    <p><strong>Name:</strong> {{ employee.name }}</p>
    <p><strong>Email:</strong> {{ employee.email }}</p>
    <p><strong>Department:</strong> {{ employee.department }}</p>
    <p><strong>Position:</strong> {{ employee.position }}</p>
  </div>
</div>
